<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
  {{ partial "head.html" . }}
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ partial "site-title.html" . }}</a>
      {{ partial "nav.html" . }}
    </header>
    <main class="site-main">
      {{ partial "breadcrumbs.html" . }}
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "analytics.html" . }}
  </body>
</html>
